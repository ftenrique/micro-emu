[package]
name = "rp2040-bridge"
version = "1.2.0"
edition = "2024"
publish = false

[dependencies]
ajazz-sdk = "=0.2.1"
hidapi = "=2.6.6"
image = { version = "0.25.5", default-features = false, features = ["jpeg"] }
rusqlite = { version = "0.31", default-features = false, features = ["bundled"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
