<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Action Index">
        <sdpi-select setting="index">
            <option value="6">ACT06</option>
            <option value="7">ACT07</option>
            <option value="8">ACT08</option>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Icon">
        <sdpi-select setting="icon">
            <option value="">Default for index</option>
            <option value="action">Action (bolt)</option>
            <option value="send">Send</option>
            <option value="mic">Mic</option>
            <option value="stop">Stop</option>
            <option value="new-chat">New chat</option>
            <option value="retry">Retry / regenerate</option>
            <option value="copy">Copy</option>
            <option value="up">Arrow up</option>
            <option value="down">Arrow down</option>
            <option value="left">Arrow left</option>
            <option value="right">Arrow right</option>
            <option value="rotor">Rotor</option>
            <option value="task">Task list</option>
        </sdpi-select>
    </sdpi-item>
</body>
</html>
