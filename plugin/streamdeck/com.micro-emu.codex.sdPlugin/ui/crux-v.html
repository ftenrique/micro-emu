<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Click Action">
        <sdpi-select setting="click" default="native">
            <option value="native">Default (Mic / ACT10)</option>
            <option value="ag0">AG00 (Agent 0)</option>
            <option value="ag1">AG01 (Agent 1)</option>
            <option value="ag2">AG02 (Agent 2)</option>
            <option value="ag3">AG03 (Agent 3)</option>
            <option value="ag4">AG04 (Agent 4)</option>
            <option value="ag5">AG05 (Agent 5)</option>
            <option value="act6">ACT06 (Action 6)</option>
            <option value="act7">ACT07 (Action 7)</option>
            <option value="act8">ACT08 (Action 8)</option>
            <option value="mic">Mic (ACT10)</option>
            <option value="send">Send (ACT12)</option>
            <option value="rotor">Rotor click (ENC_CLK)</option>
        </sdpi-select>
    </sdpi-item>
</body>
</html>
