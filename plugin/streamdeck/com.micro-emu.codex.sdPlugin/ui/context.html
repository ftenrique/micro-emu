<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Context Mode">
        <sdpi-select setting="mode" default="task">
            <option value="task">Task info</option>
            <option value="model">Model info</option>
            <option value="usage">Usage info</option>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Usage Source">
        <sdpi-select setting="usageAgent" default="codex">
            <option value="codex">Codex</option>
            <option value="zcode">ZCode</option>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Behavior">
        <div class="sdpi-info-label">Task opens search - Model cycles model - Usage is display-only (5H/weekly limits of the source above; the strip follows it)</div>
    </sdpi-item>
</body>
</html>
