<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Task Slot">
        <sdpi-select setting="slot">
            <option value="0">Slot 1</option>
            <option value="1">Slot 2</option>
            <option value="2">Slot 3</option>
            <option value="3">Slot 4</option>
            <option value="4">Slot 5</option>
            <option value="5">Slot 6</option>
            <option value="6">Slot 7</option>
            <option value="7">Slot 8</option>
            <option value="8">Slot 9</option>
        </sdpi-select>
    </sdpi-item>
    <p>Slots 1-6 mirror Codex Micro positions. Slots 7-9 are desktop-only Codex task cards and open their selected thread through Codex.</p>
</body>
</html>
