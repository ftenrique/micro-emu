<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Task Slot">
        <sdpi-select setting="slot">
            <option value="0">Slot 1</option>
            <option value="1">Slot 2</option>
            <option value="2">Slot 3</option>
            <option value="3">Slot 4</option>
            <option value="4">Slot 5</option>
            <option value="5">Slot 6</option>
            <option value="6">Slot 7</option>
            <option value="7">Slot 8</option>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Agent">
        <sdpi-select setting="agent">
            <option value="auto">Auto</option>
            <option value="codex">Codex</option>
            <option value="claude">Claude</option>
            <option value="zcode">ZCode</option>
            <option value="hermes">Hermes</option>
            <option value="t3">T3 Code</option>
        </sdpi-select>
    </sdpi-item>
    <p>Auto slots are allocated dynamically across all agents with equal priority, reusing finished or settled buttons as needed.</p>
</body>
</html>
